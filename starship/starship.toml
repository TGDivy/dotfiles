# Starship — Catppuccin Mocha palette
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](fg:#1e1e2e bg:none)\
$os\
$username\
$directory\
$git_branch\
$git_status\
$python\
$c\
$fill\
$cmd_duration\
$time\
[▓▒░](fg:#1e1e2e bg:none)\
$line_break\
$character"""

[os]
disabled = false
style = "bg:#1e1e2e fg:#cba6f7"
format = "[$symbol ]($style)"

[os.symbols]
Macos = ""
Linux = ""

[username]
show_always = false
style_user = "bg:#1e1e2e fg:#89b4fa"
format = "[$user ]($style)"

[directory]
style = "bg:#1e1e2e fg:#89dceb"
format = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo = true

[directory.substitutions]
"~/Developer" = " dev"
"~/.dotfiles" = " dots"

[git_branch]
symbol = ""
style = "bg:#1e1e2e fg:#a6e3a1"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#1e1e2e fg:#f38ba8"
format = '[$all_status$ahead_behind ]($style)'

[python]
symbol = ""
style = "bg:#1e1e2e fg:#f9e2af"
format = '[ $symbol ($version) ]($style)'
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "uv.lock"]

[c]
symbol = ""
style = "bg:#1e1e2e fg:#89b4fa"
format = '[ $symbol ]($style)'
detect_files = ["CMakeLists.txt", "*.cpp", "*.cc", "*.h"]

[cmd_duration]
min_time = 2_000
style = "bg:#1e1e2e fg:#6c7086"
format = "[ 󱦟 $duration ]($style)"

[time]
disabled = false
style = "bg:#1e1e2e fg:#6c7086"
format = "[ $time ]($style)"
time_format = "%H:%M"

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold fg:#a6e3a1)"
error_symbol   = "[❯](bold fg:#f38ba8)"
