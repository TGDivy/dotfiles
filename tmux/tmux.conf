# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Core settings ─────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # true color
set -g mouse on
set -g history-limit 10000
set -g base-index 1          # windows start at 1
set -g pane-base-index 1
set -g renumber-windows on   # fill gaps when window closes
set -g set-titles on
set -g set-titles-string "#S / #W"
set -sg escape-time 0        # instant escape in nvim
set -g focus-events on       # needed for nvim autoread
set -g set-clipboard external  # OSC 52: pass clipboard sequences to terminal
set -g allow-passthrough on    # tmux 3.3+: pass through unknown sequences (needed for OSC 52 over SSH)
set -g status-interval 5

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Navigation — vim-style ────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Splits — open in current dir ──────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Plugins — TPM ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'        # system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'   # manual save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 10 min
set -g @plugin 'catppuccin/tmux'               # theme
set -g @plugin 'omerxx/tmux-sessionx'          # fuzzy session picker: prefix+o

# ── Catppuccin theme ──────────────────────────────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"

# Status bar modules
set -g @catppuccin_status_modules_right "session date_time"
set -g @catppuccin_date_time_text "%H:%M"

# Window format
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_current_fill "all"

# ── resurrect + continuum ─────────────────────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'   # save pane scroll history too
set -g @continuum-restore 'on'                 # auto-restore on tmux server start
set -g @continuum-save-interval '10'           # save every 10 minutes

# ── sessionx config ───────────────────────────────────────────────────────────
set -g @sessionx-bind 'o'          # prefix+o = session picker
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-tree-mode 'on'

# ── Init TPM (keep at bottom) ─────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
